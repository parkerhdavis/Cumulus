services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-latest # Enterprise Edition, SQLite (https://docs.pangolin.net/self-host/enterprise-edition/activate)
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./pangolin/config:/app/config
    environment:
      - SERVER_SECRET=${SERVER_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:latest # https://github.com/fosrl/gerbil/releases
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./pangolin/config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80
      - 2222:2222/tcp # forgejo ssh (raw tcp resource; entrypoint tcp-2222 in traefik static config)

  traefik:
    image: docker.io/traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./pangolin/config/traefik:/etc/traefik:ro
      - ./pangolin/config/letsencrypt:/letsencrypt
      - ./pangolin/config/traefik/logs:/var/log/traefik

  # CrowdSec: reads Traefik's JSON access log, detects malicious patterns, and
  # feeds decisions to the Traefik bouncer plugin (see traefik_config.yml.template
  # + dynamic_config.yml.template). Also runs the AppSec/WAF engine on :7422.
  # No published ports on purpose — Traefik reaches it as crowdsec:8080 / :7422
  # over the internal `pangolin` network. Publishing would bypass the host
  # firewall via Docker's NAT (see the CrowdSec community guide's warning).
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest # https://hub.docker.com/r/crowdsecurity/crowdsec
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # Traefik parser + AppSec rule collections. AppSec needs both appsec-* sets.
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # Disable the volumetric 403/404 scenarios. They infer "attack" purely
      # from response count against a single IP, which structurally misfires on
      # this edge: every legitimate request — browsers, the fleet agents, and
      # every CLI an agent session runs — egresses one home IP, and the
      # bouncer's own 403 ban responses feed the same count. Volumetric attacks
      # are still caught by AppSec (virtual-patching/generic-rules) and the
      # targeted crowdsecurity/traefik scenarios (sqli, traversal, etc.).
      # - crowdsecurity/http-generic-bf self-reinforced into a ban loop
      #   (ban -> bouncer 403s -> re-ban every ~60s), and apps that
      #   legitimately 403 (immich's unauthenticated API calls) fed it too.
      #   NB: this is the HUB ITEM name (`cscli scenarios list`), NOT the
      #   scenario name that appears in alerts — one hub item defines both
      #   LePresidente/http-generic-403-bf and .../http-generic-404-bf, so
      #   disabling it kills both.
      # - crowdsecurity/http-probing banned the home IP twice on 2026-10-14,
      #   first for 11 then for 21 legitimate 404s — fj (forgejo-cli) probes
      #   every PR-template path variant per PR command, and Forgejo 404s
      #   each miss. Raising the capacity is whack-a-mole while sweeps grow.
      # NB: SPACE separator — the image's docker_start.sh word-splits these
      # lists, and a comma becomes one bogus item name whose cscli failure
      # exits the container into a crash loop (bit us 2026-10-14).
      - DISABLE_SCENARIOS=crowdsecurity/http-generic-bf crowdsecurity/http-probing
      # Idempotently registers a bouncer named "traefik" with this key at startup.
      # The Traefik plugin authenticates to LAPI with the same value
      # (crowdsecLapiKey in dynamic_config). Single source of truth: .env.
      - BOUNCER_KEY_traefik=${CROWDSEC_LAPI_KEY}
    volumes:
      # App state (hub collections, LAPI creds, decisions DB) in named volumes,
      # per the Cumulus convention — keeps runtime state out of the working tree.
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
      # Authored acquisition configs (tracked in git), overlaying the volume.
      - ./pangolin/config/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      # Traefik's access log, read-only.
      - ./pangolin/config/traefik/logs:/var/log/traefik:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: "30s"
      timeout: "10s"
      retries: 5

volumes:
  crowdsec-config:
  crowdsec-data:

networks:
  default:
    driver: bridge
    name: pangolin
