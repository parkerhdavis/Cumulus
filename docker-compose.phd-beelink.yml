# Headless Obsidian Sync (https://obsidian.md/help/sync/headless) — one
# container per vault, none of which need Obsidian open to sync. On first
# start each container logs in with the OBSIDIAN_* credentials from .env,
# creates its remote vault when missing (end-to-end encrypted with
# OBSIDIAN_E2EE_PASSWORD), links the local folder to it under the device name
# `<host>-<vault>`, and then runs `ob sync --continuous`. Login + setup state
# persists in the shared obsidian-headless state volume, so recreated
# containers skip straight to syncing. Config syncing (theme, plugins, plugin
# data, hotkeys) is enabled explicitly by the entrypoint, so .obsidian/
# syncs like it does between desktop machines; headless clients carry those
# files without running the plugins themselves.
#
# Caution: per Obsidian's docs, run only ONE sync method per device — if the
# desktop Obsidian app on this machine also syncs a vault that a container
# here syncs, disable the desktop Sync plugin for it. Each container links to
# the remote vault labeled exactly with its vault's folder name, creating one
# under that name when none exists, so the remote label and the vault name
# are always the same.
x-obsidian-env: &obsidian-env
  OBSIDIAN_EMAIL: ${OBSIDIAN_EMAIL}
  OBSIDIAN_PASSWORD: ${OBSIDIAN_PASSWORD}
  OBSIDIAN_E2EE_PASSWORD: ${OBSIDIAN_E2EE_PASSWORD}
  OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN:-}

x-obsidian-sync: &obsidian-sync
  build: ./obsidian-sync
  image: cumulus/obsidian-sync:latest
  restart: unless-stopped
  user: "${OBSIDIAN_UID:-1000}:${OBSIDIAN_GID:-1000}"

services:
  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - NEWT_ID=${BEELINK_SITE_ID}
      - NEWT_SECRET=${BEELINK_SITE_SECRET}

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"  # render group GID on phd-beelink; verify with: getent group render
    environment:
      # Point the Vulkan loader at the RADV ICD bundled with jellyfin-ffmpeg
      # so HDR tone-mapping can use Vulkan compute on AMD (the image only
      # ships Intel OpenCL ICDs by default).
      - VK_ICD_FILENAMES=/usr/lib/jellyfin-ffmpeg/share/vulkan/icd.d/radeon_icd.x86_64.json
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Ofelia — cron-style scheduler for the Tier-3 proxy encode. It only schedules;
  # the encode itself runs in an ephemeral cumulus/proxy-encoder container Ofelia
  # spawns via the Docker socket (see ofelia/config.ini + media-pipeline/
  # transcode-proxies.sh). Both the encoder image and the rendered job config are
  # produced by `make setup phd-beelink` (image from ofelia/encoder.Dockerfile,
  # config from ofelia/config.ini.template). No ports — internal only. The Docker
  # socket is mounted read-only (required for job-run).
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini
    environment:
      # Ofelia evaluates the job cron in the container's local time, so pin it to
      # the media timezone — otherwise "2am" would be 2am UTC.
      - TZ=${PROXY_TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro

  # Immich — self-hosted photo/video management
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    restart: always
    ports:
      - "127.0.0.1:2283:2283"
    volumes:
      - ${IMMICH_LIBRARY_PATH}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PASSWORD=${IMMICH_REDIS_PASSWORD}
      - DB_HOSTNAME=immich-database
    depends_on:
      - immich-redis
      - immich-database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: always
    volumes:
      - immich-model-cache:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    restart: always
    command: valkey-server --requirepass ${IMMICH_REDIS_PASSWORD}
    healthcheck:
      test: redis-cli -a ${IMMICH_REDIS_PASSWORD} ping || exit 1

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_PATH}:/var/lib/postgresql/data
    shm_size: 128mb

  # Open WebUI — browser-based LLM chat interface. Its Ollama Cloud
  # (OpenAI-compatible) connection is set from the admin UI in the app —
  # deliberately not from .env, since the key rotates periodically.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DEFAULT_PROMPT_SUGGESTIONS=[{}]
    volumes:
      - open-webui-data:/app/backend/data

  # Gokapi — lightweight self-hosted file drop (Firefox Send alternative).
  # First-run config (admin account + public URL) is done through the web setup
  # wizard at https://drop.${BASE_DOMAIN}/setup, like Jellyfin/Immich. Uploaded
  # files land on a host bind-mount (they can grow) — mirroring Jellyfin media /
  # the Immich library — while the tiny config + SQLite DB stays in a named
  # volume. Exposed at drop.${BASE_DOMAIN} through Pangolin (HTTP → localhost:53842).
  gokapi:
    image: f0rc3/gokapi:latest
    container_name: gokapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:53842:53842"
    environment:
      - TZ=${GOKAPI_TZ:-UTC}
    volumes:
      - ${GOKAPI_DATA_PATH}:/app/data
      - gokapi-config:/app/config

  obsidian-anthers-wiki:
    <<: *obsidian-sync
    container_name: obsidian-anthers-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Anthers-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-anthers-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Anthers/Anthers-Wiki:/vaults/Anthers-Wiki

  obsidian-carelaw-wiki:
    <<: *obsidian-sync
    container_name: obsidian-carelaw-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Carelaw-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-carelaw-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Carelaw/Carelaw-Wiki:/vaults/Carelaw-Wiki

  obsidian-customchannels-wiki:
    <<: *obsidian-sync
    container_name: obsidian-customchannels-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: CustomChannels-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-customchannels-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/CustomChannels/CustomChannels-Wiki:/vaults/CustomChannels-Wiki

  obsidian-polysemy-wiki:
    <<: *obsidian-sync
    container_name: obsidian-polysemy-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Polysemy-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-polysemy-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Polysemy/Polysemy-Wiki:/vaults/Polysemy-Wiki

  obsidian-gamedev-wiki:
    <<: *obsidian-sync
    container_name: obsidian-gamedev-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: GameDev-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-gamedev-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/GameDev/GameDev-Wiki:/vaults/GameDev-Wiki

  obsidian-software-wiki:
    <<: *obsidian-sync
    container_name: obsidian-software-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Software-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-software-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Software/Software-Wiki:/vaults/Software-Wiki

  obsidian-musicmaking-wiki:
    <<: *obsidian-sync
    container_name: obsidian-musicmaking-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Musicmaking-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-musicmaking-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Musicmaking/Musicmaking-Wiki:/vaults/Musicmaking-Wiki

  obsidian-filmmaking-wiki:
    <<: *obsidian-sync
    container_name: obsidian-filmmaking-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Filmmaking-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-filmmaking-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Filmmaking/Filmmaking-Wiki:/vaults/Filmmaking-Wiki

  obsidian-phd-wiki:
    <<: *obsidian-sync
    container_name: obsidian-phd-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: PhD-Wiki
      OBSIDIAN_DEVICE_NAME: beelink-phd-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/PhD-Wiki:/vaults/PhD-Wiki

  obsidian-personal:
    <<: *obsidian-sync
    container_name: obsidian-personal
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Personal
      OBSIDIAN_DEVICE_NAME: beelink-personal
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Personal:/vaults/Personal

volumes:
  jellyfin-config:
    external: true
  jellyfin-cache:
    external: true
  open-webui-data:
  immich-model-cache:
  gokapi-config:
  obsidian-headless-state:
