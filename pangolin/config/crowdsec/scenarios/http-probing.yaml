# LOCAL OVERRIDE of the hub's crowdsecurity/http-probing scenario, mounted
# read-only over the installed hub copy (see docker-compose.droplet.yml).
# Tuned 2026-10-14 after CrowdSec banned the home IP for 4h: fj
# (forgejo-cli) sweeps PR templates across two template dirs x three
# extensions, in ~1s, on every PR command it runs, and Forgejo 404s each
# miss — 11 requests, one over the old bucket's capacity of 10. The ban
# covered every resource on the edge plus all three fleet agents, which
# egress from the same IP. capacity 20 absorbs a full template sweep with
# headroom; real scanners still overflow quickly since leakspeed (10s)
# barely refills the bucket. Update this file via PR, then reload:
#   docker kill -s HUP crowdsec
# The hub copy lives in the crowdsec-config volume and gets reinstalled by
# hub upgrades; this mount keeps the tuned values regardless.
# 404 scan
type: leaky
#debug: true
name: crowdsecurity/http-probing
description: "Detect site scanning/probing from a single ip"
filter: "evt.Meta.service == 'http' && evt.Meta.http_status in ['404', '403', '400'] && evt.Parsed.static_ressource == 'false'"
groupby: "evt.Meta.source_ip + '/' + evt.Parsed.target_fqdn"
distinct: "evt.Meta.http_path"
capacity: 20
reprocess: true
leakspeed: "10s"
blackhole: 5m
labels:
  remediation: true
  classification:
    - attack.T1595
  behavior: "http:scan"
  label: "HTTP Probing"
  spoofable: 0
  service: http
  confidence: 1