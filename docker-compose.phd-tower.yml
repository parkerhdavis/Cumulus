# phd-tower — Pangolin site agent + headless Obsidian Sync.
#
# fosrl/pangolin-cli is the newer site agent alongside fosrl/newt: it connects
# back to the Pangolin endpoint and its credentials are issued as a site's
# ID/secret pair from the Pangolin dashboard (vs newt's client ID/secret).
# Like newt, it makes an outbound connection — no published ports, nothing to
# expose on the router. It runs on host networking so resources targeting
# localhost resolve against the tower's own ports (same convention as the
# newt hosts).

# Headless Obsidian Sync (https://obsidian.md/help/sync/headless) — one
# container per vault, none of which need Obsidian open to sync. On first
# start each container logs in with the OBSIDIAN_* credentials from .env,
# creates its remote vault when missing (end-to-end encrypted with
# OBSIDIAN_E2EE_PASSWORD), links the local folder to it under the device name
# `<host>-<vault>`, and then runs `ob sync --continuous`. Login + setup state
# persists in the shared obsidian-headless state volume, so recreated
# containers skip straight to syncing. Config syncing (theme, plugins, plugin
# data, hotkeys) is enabled explicitly by the entrypoint, so .obsidian/
# syncs like it does between desktop machines; headless clients carry those
# files without running the plugins themselves.
#
# Caution: per Obsidian's docs, run only ONE sync method per device — if the
# desktop Obsidian app on this machine also syncs a vault that a container
# here syncs, disable the desktop Sync plugin for it. Each container links to
# the remote vault labeled exactly with its vault's folder name, creating one
# under that name when none exists, so the remote label and the vault name
# are always the same.
x-obsidian-env: &obsidian-env
  OBSIDIAN_EMAIL: ${OBSIDIAN_EMAIL}
  OBSIDIAN_PASSWORD: ${OBSIDIAN_PASSWORD}
  OBSIDIAN_E2EE_PASSWORD: ${OBSIDIAN_E2EE_PASSWORD}
  OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN:-}

x-obsidian-sync: &obsidian-sync
  build: ./obsidian-sync
  image: cumulus/obsidian-sync:latest
  restart: unless-stopped
  user: "${OBSIDIAN_UID:-1000}:${OBSIDIAN_GID:-1000}"

services:
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - SITE_ID=${TOWER_SITE_ID}
      - SITE_SECRET=${TOWER_SITE_SECRET}

  obsidian-anthers-wiki:
    <<: *obsidian-sync
    container_name: obsidian-anthers-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Anthers-Wiki
      OBSIDIAN_DEVICE_NAME: tower-anthers-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Anthers/Anthers-Wiki:/vaults/Anthers-Wiki

  obsidian-carelaw-wiki:
