# phd-tower — Pangolin site agent + x11vnc sharing the real display.
#
# fosrl/pangolin-cli is the newer site agent alongside fosrl/newt: it connects
# back to the Pangolin endpoint and its credentials are issued as a site's
# ID/secret pair from the Pangolin dashboard (vs newt's client ID/secret).
# Like newt, it makes an outbound connection — no published ports, nothing to
# expose on the router. It runs on host networking so resources targeting
# localhost resolve against the tower's own ports (same convention as the
# newt hosts).

services:
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - SITE_ID=${TOWER_SITE_ID}
      - SITE_SECRET=${TOWER_SITE_SECRET}

  # x11vnc — shares the machine's real X11 display (:0), containerized per the
  # repo pattern: the host's X socket and LightDM's Xauthority are bind-mounted
  # read-only, so this is a portal into the actual logged-in session (greeter
  # included after a reboot) rather than a separate desktop. Password from
  # .env; listens on the host's loopback :5900 for a Pangolin VNC resource.
  x11vnc:
    build: ./x11vnc
    container_name: x11vnc
    restart: unless-stopped
    # Must equal this host's hostname: the Xauthority cookie entry is keyed
    # by it, and Xlib's auth lookup fails silently against any other name.
    hostname: ${X_HOSTNAME:?X_HOSTNAME must be set in .env (this machine's hostname)}
    environment:
      - DESKTOP_PASSWORD=${DESKTOP_PASSWORD:?DESKTOP_PASSWORD must be set in .env}
      - X_DISPLAY=${X_DISPLAY:-unix:0}
      - X_AUTHORITY=${X_AUTHORITY:-/var/run/lightdm/root/:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - type: bind
        source: /var/run/lightdm/root
        target: /var/run/lightdm/root
        read_only: true
    ports:
      - "127.0.0.1:5900:5900"

volumes: {}