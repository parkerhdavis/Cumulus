# phd-tower — Pangolin site agent + xvnc sandbox desktop.
#
# fosrl/pangolin-cli is the newer site agent alongside fosrl/newt: it connects
# back to the Pangolin endpoint and its credentials are issued as a site's
# ID/secret pair from the Pangolin dashboard (vs newt's client ID/secret).
# Like newt, it makes an outbound connection — no published ports, nothing to
# expose on the router. It runs on host networking so resources targeting
# localhost resolve against the tower's own ports (same convention as the
# newt hosts).

services:
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - SITE_ID=${TOWER_SITE_ID}
      - SITE_SECRET=${TOWER_SITE_SECRET}

  # xvnc sandbox desktop — a containerized XFCE desktop (TigerVNC) speaking
  # native RFB on :5901 for a Pangolin VNC resource. Bound to loopback only:
  # the site agent (host networking) reaches it as backend localhost:5901.
  # Password comes from .env (VNC_PW); home directory persists in a volume.
  xvnc:
    image: accetto/ubuntu-vnc-xfce-g3:latest
    container_name: xvnc
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - VNC_PW=${DESKTOP_PASSWORD:?DESKTOP_PASSWORD must be set in .env}
      - VNC_RESOLUTION=1920x1080
    volumes:
      - xvnc-home:/home/headless
    ports:
      - "127.0.0.1:5901:5901"

volumes:
  xvnc-home: