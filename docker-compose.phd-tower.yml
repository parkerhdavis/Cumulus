# phd-tower — Pangolin site agent, Forgejo forge, and headless Obsidian Sync.
#
# fosrl/pangolin-cli is the fleet's site agent: it connects back to the
# Pangolin endpoint with the site's ID/secret pair from the Pangolin dashboard,
# making an outbound connection — no published ports, nothing to expose on the
# router. It runs on host networking so resources targeting localhost resolve
# against the tower's own ports. The three Docker prerequisites from
# https://docs.pangolin.net/manage/clients/platforms/cli#docker-pangolin-cli —
# network_mode: host (the tunnel interface lands on the host), NET_ADMIN
# (permission to manage network interfaces), and /dev/net/tun (creating the
# WireGuard interface) — are declared on every pangolin-* service below.

# Headless Obsidian Sync (https://obsidian.md/help/sync/headless) — one
# container per vault, none of which need Obsidian open to sync. On first
# start each container logs in with the OBSIDIAN_* credentials from .env,
# creates its remote vault when missing (end-to-end encrypted with
# OBSIDIAN_E2EE_PASSWORD), links the local folder to it under the device name
# `<host>-<vault>`, and then runs `ob sync --continuous`. Login + setup state
# persists in the shared obsidian-headless state volume, so recreated
# containers skip straight to syncing. Config syncing (theme, plugins, plugin
# data, hotkeys) is enabled explicitly by the entrypoint, so .obsidian/
# syncs like it does between desktop machines; headless clients carry those
# files without running the plugins themselves.
#
# Caution: per Obsidian's docs, run only ONE sync method per device — if the
# desktop Obsidian app on this machine also syncs a vault that a container
# here syncs, disable the desktop Sync plugin for it. Each container links to
# the remote vault labeled exactly with its vault's folder name, creating one
# under that name when none exists, so the remote label and the vault name
# are always the same.
x-obsidian-env: &obsidian-env
  OBSIDIAN_EMAIL: ${OBSIDIAN_EMAIL}
  OBSIDIAN_PASSWORD: ${OBSIDIAN_PASSWORD}
  OBSIDIAN_E2EE_PASSWORD: ${OBSIDIAN_E2EE_PASSWORD}
  OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN:-}
  OBSIDIAN_UID: ${OBSIDIAN_UID:-1000}
  OBSIDIAN_GID: ${OBSIDIAN_GID:-1000}

x-obsidian-sync: &obsidian-sync
  build: ./obsidian-sync
  image: cumulus/obsidian-sync:latest
  restart: unless-stopped

# forgejo — self-hosted git forge (https://forgejo.org), filling the VCS-hosting
# hole the Perforce Helix Core removal (#35) left in the stack. Design details
# and decisions live in the Forgejo Forge Plan in the Software-Wiki (50 Cumulus,
# 90-99 Agents/Transient). Configuration is entirely via FORGEJO__* env vars so
# a fresh deploy reproduces from this repo plus .env: INSTALL_LOCK makes the
# first boot run migrations headlessly with no web wizard, and
# DISABLE_REGISTRATION closes public sign-up before the forge ever serves a
# request (the admin account is created through the container CLI once).
#
# Git LFS is on (LFS_START_SERVER) and rides the same HTTPS endpoint as the UI;
# its JWT secret comes from .env. Repositories and LFS live on the
# FORGEJO_DATA_PATH bind mount, so that one directory plus the forgejo-db-data
# volume are the entire backup unit.
#
# Reach: the web UI is published on loopback (127.0.0.1:3000) and exposed
# through Pangolin as an HTTP resource at forge.${BASE_DOMAIN}; the built-in
# SSH server is published on loopback (127.0.0.1:2222) and exposed through
# Pangolin as a raw TCP resource on the same port — the pattern the p4 passthrough
# used. Trusted-proxy headers work with Forgejo's defaults because the tunnel
# arrives on loopback; real client IPs come from Traefik's X-Forwarded-For chain.
# The image tag is pinned to the major (16) — Forgejo major upgrades need
# manual verification, while `make pull phd-tower` still picks up patches.
x-forgejo-db-env: &forgejo-db-env
  POSTGRES_USER: forgejo
  POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
  POSTGRES_DB: forgejo

networks:
  forgejo:
    external: false
    # Pinned so REVERSE_PROXY_TRUSTED_PROXIES below stays correct across
    # recreations — Docker numbers new networks from the free pool otherwise.
    ipam:
      config:
        - subnet: 172.30.240.0/24

services:
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - SITE_ID=${TOWER_SITE_ID}
      - SITE_SECRET=${TOWER_SITE_SECRET}

  pangolin-client:
    image: fosrl/pangolin-cli
    container_name: pangolin-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes:
      - ./pangolin-client-config:/root/.config/pangolin
      - /etc/hosts:/host-etc/hosts
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        H=/host-etc/hosts
        awk '/# BEGIN pangolin-client/{s=1;next} /# END pangolin-client/{s=0;next} !s' "$$H" > /tmp/hosts.new
        cat >> /tmp/hosts.new <<'EOF'
        # BEGIN pangolin-client
        100.96.128.8 phd-beelink.internal
        100.96.128.9 phd-tower.internal
        100.96.128.10 phd-razer.internal
        # END pangolin-client
        EOF
        cat /tmp/hosts.new > "$$H"
        exec /usr/local/bin/pangolin-cli up --attach

  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    networks:
      - forgejo
    depends_on:
      - forgejo-db
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # --- server ---
      - FORGEJO__server__DOMAIN=forge.${BASE_DOMAIN}
      - FORGEJO__server__ROOT_URL=https://forge.${BASE_DOMAIN}/
      - FORGEJO__server__SSH_DOMAIN=forge.${BASE_DOMAIN}
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__server__LFS_JWT_SECRET=${FORGEJO_LFS_JWT_SECRET}
      # --- database ---
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=forgejo-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      # --- security / service ---
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY}
      - FORGEJO__security__INTERNAL_TOKEN=${FORGEJO_INTERNAL_TOKEN}
      # The published-port chain rewrites the connection source to the compose
      # network gateway, which must be trusted for the X-Forwarded-For chain
      # (set at the droplet's Traefik edge) to surface real client IPs.
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=172.30.240.0/24,127.0.0.0/8,::1/128
      - FORGEJO__service__DISABLE_REGISTRATION=true
    volumes:
      # Long bind syntax: any value here is treated as a path, so a placeholder
      # or unset variable degrades to a wrong-dir mount instead of the whole
      # compose project failing to parse (which bricks every make command on
      # the host — a short-syntax `${VAR}:/data` with a bare word is read as a
      # named volume reference and refused).
      - type: bind
        source: ${FORGEJO_DATA_PATH}
        target: /data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"

  forgejo-db:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: unless-stopped
    networks:
      - forgejo
    environment:
      <<: *forgejo-db-env
    volumes:
      - forgejo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # forge-backup — the monthly restic backup of ForgeData, home, and a fresh
  # pg_dump of forgejo-db to DO Spaces cold storage (design: phd-tower Backup
  # Design in the Software-Wiki). Self-scheduling (crond + backup.sh in
  # restic/), no Docker socket, dump over the compose network. Deliberately
  # UNPLUGGED: the `backups` compose profile keeps it out of `make up` until
  # the initial run is wanted after the project migration — plugging in is
  # `restic init` then `docker compose -f docker-compose.phd-tower.yml
  # --profile backups up -d backup` once BACKUP_* exists in .env.
  backup:
    build: ./restic
    image: cumulus/forge-backup:latest
    container_name: forge-backup
    restart: unless-stopped
    profiles:
      - backups
    networks:
      - forgejo
    environment:
      RESTIC_REPOSITORY: ${BACKUP_REPOSITORY:-}
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
      RESTIC_COMPRESSION: max
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
      PGPASSWORD: ${FORGEJO_DB_PASSWORD}
    volumes:
      - /media/parker/ForgeData:/forge-data:ro
      - /home/parker:/home/parker:ro
      - forge-backup-dump:/backups

  obsidian-anthers-wiki:
    <<: *obsidian-sync
    container_name: obsidian-anthers-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Anthers-Wiki
      OBSIDIAN_DEVICE_NAME: tower-anthers-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Anthers/Anthers-Wiki:/vaults/Anthers-Wiki

  obsidian-carelaw-wiki:
    <<: *obsidian-sync
    container_name: obsidian-carelaw-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Carelaw-Wiki
      OBSIDIAN_DEVICE_NAME: tower-carelaw-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Carelaw/Carelaw-Wiki:/vaults/Carelaw-Wiki

  obsidian-customchannels-wiki:
    <<: *obsidian-sync
    container_name: obsidian-customchannels-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: CustomChannels-Wiki
      OBSIDIAN_DEVICE_NAME: tower-customchannels-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/CustomChannels/CustomChannels-Wiki:/vaults/CustomChannels-Wiki

  obsidian-polysemy-wiki:
    <<: *obsidian-sync
    container_name: obsidian-polysemy-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Polysemy-Wiki
      OBSIDIAN_DEVICE_NAME: tower-polysemy-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Polysemy/Polysemy-Wiki:/vaults/Polysemy-Wiki

  obsidian-gamedev-wiki:
    <<: *obsidian-sync
    container_name: obsidian-gamedev-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: GameDev-Wiki
      OBSIDIAN_DEVICE_NAME: tower-gamedev-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/GameDev/GameDev-Wiki:/vaults/GameDev-Wiki

  obsidian-software-wiki:
    <<: *obsidian-sync
    container_name: obsidian-software-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Software-Wiki
      OBSIDIAN_DEVICE_NAME: tower-software-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Software/Software-Wiki:/vaults/Software-Wiki

  obsidian-musicmaking-wiki:
    <<: *obsidian-sync
    container_name: obsidian-musicmaking-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Musicmaking-Wiki
      OBSIDIAN_DEVICE_NAME: tower-musicmaking-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Musicmaking/Musicmaking-Wiki:/vaults/Musicmaking-Wiki

  obsidian-filmmaking-wiki:
    <<: *obsidian-sync
    container_name: obsidian-filmmaking-wiki
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Filmmaking-Wiki
      OBSIDIAN_DEVICE_NAME: tower-filmmaking-wiki
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Filmmaking/Filmmaking-Wiki:/vaults/Filmmaking-Wiki

      - ${OBSIDIAN_VAULTS_BASE}/PhD-Wiki:/vaults/PhD-Wiki

  obsidian-personal:
    <<: *obsidian-sync
    container_name: obsidian-personal
    environment:
      <<: *obsidian-env
      OBSIDIAN_VAULT_NAME: Personal
      OBSIDIAN_DEVICE_NAME: tower-personal
    volumes:
      - obsidian-headless-state:/state
      - ${OBSIDIAN_VAULTS_BASE}/Personal:/vaults/Personal

volumes:
  obsidian-headless-state:
  forgejo-db-data:
  forge-backup-dump: