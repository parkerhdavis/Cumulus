# phd-razer — Pangolin site and client agents.
#
# fosrl/pangolin-cli dials out to the Pangolin endpoint. Both roles
# authenticate with id/secret pairs from the Pangolin dashboard: the site
# (RAZER_SITE_*) registers this machine's inbound tunnels, the machine client
# (RAZER_MACHINE_*) opens outbound tunnels. Machines carry no CLI-side org or
# exit-node selection and no role-based standing access — to reach a private
# resource, that machine must be on the resource's Machine Clients list in
# the dashboard; without any such grant the client connects but no tunnel
# peer forms. No published ports — nothing to expose on the router.

services:
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - SITE_ID=${RAZER_SITE_ID}
      - SITE_SECRET=${RAZER_SITE_SECRET}

  pangolin-client:
    image: fosrl/pangolin-cli
    container_name: pangolin-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - CLIENT_ID=${RAZER_MACHINE_ID}
      - CLIENT_SECRET=${RAZER_MACHINE_SECRET}
    volumes:
      - /etc/hosts:/host-etc/hosts
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        H=/host-etc/hosts
        awk '/# BEGIN pangolin-client/{s=1;next} /# END pangolin-client/{s=0;next} !s' "$$H" > /tmp/hosts.new
        cat >> /tmp/hosts.new <<'EOF'
        # BEGIN pangolin-client
        100.96.128.8 phd-beelink.internal
        100.96.128.9 phd-tower.internal
        100.96.128.10 phd-razer.internal
        # END pangolin-client
        EOF
        cat /tmp/hosts.new > "$$H"
        exec /usr/local/bin/pangolin-cli up --id "$$CLIENT_ID" --secret "$$CLIENT_SECRET" --endpoint "$$PANGOLIN_ENDPOINT" --attach
