# phd-razer — Pangolin site agent only.
#
# fosrl/newt dials out to the Pangolin endpoint; its credentials are the
# site's ID/secret pair from the Pangolin dashboard (RAZER_SITE_*). No
# published ports — nothing to expose on the router.

services:
  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - NEWT_ID=${RAZER_SITE_ID}
      - NEWT_SECRET=${RAZER_SITE_SECRET}

  # xvnc sandbox desktop — a containerized XFCE desktop (TigerVNC) speaking
  # native RFB on :5901 for a Pangolin VNC resource. Bound to loopback only:
  # the site agent (host networking) reaches it as backend localhost:5901.
  # Password comes from .env (VNC_PW); home directory persists in a volume.
  xvnc:
    image: accetto/ubuntu-vnc-xfce-g3:latest
    container_name: xvnc
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      - VNC_PW=${DESKTOP_PASSWORD:?DESKTOP_PASSWORD must be set in .env}
      - VNC_RESOLUTION=1920x1080
    volumes:
      - xvnc-home:/home/headless
    ports:
      - "127.0.0.1:5901:5901"

volumes:
  xvnc-home: