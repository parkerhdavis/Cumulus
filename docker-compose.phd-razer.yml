# phd-razer — Pangolin site agent only.
#
# fosrl/newt dials out to the Pangolin endpoint; its credentials are the
# site's ID/secret pair from the Pangolin dashboard (RAZER_SITE_*). No
# published ports — nothing to expose on the router.

services:
  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - NEWT_ID=${RAZER_SITE_ID}
      - NEWT_SECRET=${RAZER_SITE_SECRET}

  # xrdp sandbox desktop — a containerized XFCE desktop served over native RDP
  # on :3389 (username 'abc', password set from .env at startup; the image
  # default is abc/abc, which would otherwise reset on recreate). Bound to
  # loopback only: newt (host networking) reaches it as backend localhost:3389
  # for a Pangolin RDP resource. The /config volume keeps the home directory
  # across recreates; system-level packages installed inside do not survive.
  rdesktop:
    image: lscr.io/linuxserver/rdesktop:ubuntu-xfce
    container_name: rdesktop
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Denver
    volumes:
      - rdesktop-config:/config
    ports:
      - "127.0.0.1:3389:3389"
    entrypoint:
      - /bin/bash
      - -c
      - 'echo "abc:${DESKTOP_PASSWORD:?DESKTOP_PASSWORD must be set in .env}" | chpasswd && exec /init'

volumes:
  rdesktop-config: