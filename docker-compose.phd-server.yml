services:
  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"  # render group GID on phd-server; verify with: getent group render
    environment:
      # Point the Vulkan loader at the RADV ICD bundled with jellyfin-ffmpeg
      # so HDR tone-mapping can use Vulkan compute on AMD (the image only
      # ships Intel OpenCL ICDs by default).
      - VK_ICD_FILENAMES=/usr/lib/jellyfin-ffmpeg/share/vulkan/icd.d/radeon_icd.x86_64.json
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Ofelia — cron-style scheduler for the Tier-3 proxy encode. It only schedules;
  # the encode itself runs in an ephemeral cumulus/proxy-encoder container Ofelia
  # spawns via the Docker socket (see ofelia/config.ini + media-pipeline/
  # transcode-proxies.sh). Both the encoder image and the rendered job config are
  # produced by `make setup phd-server` (image from ofelia/encoder.Dockerfile,
  # config from ofelia/config.ini.template). No ports — internal only. The Docker
  # socket is mounted read-only (required for job-run).
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: unless-stopped
    command: daemon --config=/etc/ofelia/config.ini
    environment:
      # Ofelia evaluates the job cron in the container's local time, so pin it to
      # the media timezone — otherwise "2am" would be 2am UTC.
      - TZ=${PROXY_TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/config.ini:/etc/ofelia/config.ini:ro

  # Immich — self-hosted photo/video management
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    restart: always
    ports:
      - "127.0.0.1:2283:2283"
    volumes:
      - ${IMMICH_LIBRARY_PATH}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PASSWORD=${IMMICH_REDIS_PASSWORD}
      - DB_HOSTNAME=immich-database
    depends_on:
      - immich-redis
      - immich-database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: always
    volumes:
      - immich-model-cache:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    restart: always
    command: valkey-server --requirepass ${IMMICH_REDIS_PASSWORD}
    healthcheck:
      test: redis-cli -a ${IMMICH_REDIS_PASSWORD} ping || exit 1

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_PATH}:/var/lib/postgresql/data
    shm_size: 128mb

  # Open WebUI + Ollama — local LLM interface
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ${OLLAMA_DATA_PATH}:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URLS=${OPEN_WEBUI_OLLAMA_URLS:-http://ollama:11434}
      - OPENAI_API_BASE_URLS=${OLLAMA_CLOUD_API_KEY:+https://ollama.com/v1}
      - OPENAI_API_KEYS=${OLLAMA_CLOUD_API_KEY:-}
      - DEFAULT_PROMPT_SUGGESTIONS=[{}]
      - ENABLE_PERSISTENT_CONFIG=False
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Perforce Helix Core — version control server
  perforce:
    build: ./perforce
    container_name: perforce
    restart: unless-stopped
    ports:
      - "127.0.0.1:1666:1666"
    volumes:
      - /mnt/vault-3/Perforce:/data

  # Websidian — self-hosted Obsidian vault web viewer
  websidian:
    build: ./websidian
    container_name: websidian
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSIDIAN_HOST_PORT:-3200}:${WEBSIDIAN_PORT:-3000}"
    volumes:
      - ${VAULT_PATH}:/vault:ro
    environment:
      - VAULT_PATH=/vault
      - HIDE_FOLDERS=${WEBSIDIAN_HIDE_FOLDERS:-.obsidian,.git,.trash,.stversions,.stfolder,.claude}
      - PORT=${WEBSIDIAN_PORT:-3000}

  # Gokapi — lightweight self-hosted file drop (Firefox Send alternative).
  # First-run config (admin account + public URL) is done through the web setup
  # wizard at https://drop.${BASE_DOMAIN}/setup, like Jellyfin/Immich. Uploaded
  # files land on a host bind-mount (they can grow) — mirroring Jellyfin media /
  # the Immich library — while the tiny config + SQLite DB stays in a named
  # volume. Exposed at drop.${BASE_DOMAIN} through Pangolin (HTTP → localhost:53842).
  gokapi:
    image: f0rc3/gokapi:latest
    container_name: gokapi
    restart: unless-stopped
    ports:
      - "127.0.0.1:53842:53842"
    environment:
      - TZ=${GOKAPI_TZ:-UTC}
    volumes:
      - ${GOKAPI_DATA_PATH}:/app/data
      - gokapi-config:/app/config

volumes:
  jellyfin-config:
    external: true
  jellyfin-cache:
    external: true
  open-webui-data:
  immich-model-cache:
  gokapi-config:
