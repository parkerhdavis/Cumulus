# Kitsu's three Zou roles share one locally-built image. Compose builds the
# context once; all three reference the same tag.
x-zou-build: &zou-build
  build:
    context: ./kitsu/zou
    args:
      ZOU_VERSION: ${ZOU_VERSION:-1.0.51}
  image: cumulus-zou:${ZOU_VERSION:-1.0.51}

services:
  newt:
    image: fosrl/newt
    container_name: newt
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - PANGOLIN_ENDPOINT=https://pangolin.${BASE_DOMAIN}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "992"  # render group GID on phd-server; verify with: getent group render
    environment:
      # Point the Vulkan loader at the RADV ICD bundled with jellyfin-ffmpeg
      # so HDR tone-mapping can use Vulkan compute on AMD (the image only
      # ships Intel OpenCL ICDs by default).
      - VK_ICD_FILENAMES=/usr/lib/jellyfin-ffmpeg/share/vulkan/icd.d/radeon_icd.x86_64.json
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: ${JELLYFIN_MEDIA_PATH}
        target: /media
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Immich — self-hosted photo/video management
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    restart: always
    ports:
      - "127.0.0.1:2283:2283"
    volumes:
      - ${IMMICH_LIBRARY_PATH}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_USERNAME=${IMMICH_DB_USERNAME}
      - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
      - REDIS_PASSWORD=${IMMICH_REDIS_PASSWORD}
      - DB_HOSTNAME=immich-database
    depends_on:
      - immich-redis
      - immich-database

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich_machine_learning
    restart: always
    volumes:
      - immich-model-cache:/cache

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    restart: always
    command: valkey-server --requirepass ${IMMICH_REDIS_PASSWORD}
    healthcheck:
      test: redis-cli -a ${IMMICH_REDIS_PASSWORD} ping || exit 1

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${IMMICH_DB_PATH}:/var/lib/postgresql/data
    shm_size: 128mb

  # Open WebUI + Ollama — local LLM interface
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ${OLLAMA_DATA_PATH}:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URLS=${OPEN_WEBUI_OLLAMA_URLS:-http://ollama:11434}
      - OPENAI_API_BASE_URLS=${OLLAMA_CLOUD_API_KEY:+https://ollama.com/v1}
      - OPENAI_API_KEYS=${OLLAMA_CLOUD_API_KEY:-}
      - DEFAULT_PROMPT_SUGGESTIONS=[{}]
      - ENABLE_PERSISTENT_CONFIG=False
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - ollama
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Perforce Helix Core — version control server
  perforce:
    build: ./perforce
    container_name: perforce
    restart: unless-stopped
    ports:
      - "127.0.0.1:1666:1666"
    volumes:
      - /mnt/vault-3/Perforce:/data

  # Websidian — self-hosted Obsidian vault web viewer
  websidian:
    build: ./websidian
    container_name: websidian
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSIDIAN_HOST_PORT:-3200}:${WEBSIDIAN_PORT:-3000}"
    volumes:
      - ${VAULT_PATH}:/vault:ro
    environment:
      - VAULT_PATH=/vault
      - HIDE_FOLDERS=${WEBSIDIAN_HIDE_FOLDERS:-.obsidian,.git,.trash,.stversions,.stfolder,.claude}
      - PORT=${WEBSIDIAN_PORT:-3000}

  # Zulip — team chat
  # Services adapted from the upstream docker-zulip packaging
  # (https://github.com/zulip/docker-zulip). Dependent services are prefixed
  # `zulip-` to match the Cumulus convention (cf. immich-*); the SETTING_*
  # overrides on the zulip service point at those renamed hostnames.
  # Secrets are mounted as files from ./zulip/secrets/ (gitignored); run
  # `make setup phd-server` to generate the random ones.
  zulip:
    image: ghcr.io/zulip/zulip-server:${ZULIP_IMAGE_TAG:-12.0-1}
    container_name: zulip
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
    environment:
      SETTING_REMOTE_POSTGRES_HOST: zulip-database
      SETTING_MEMCACHED_LOCATION: zulip-memcached:11211
      SETTING_RABBITMQ_HOST: zulip-rabbitmq
      SETTING_REDIS_HOST: zulip-redis
      SETTING_EXTERNAL_HOST: zulip.${BASE_DOMAIN}
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMINISTRATOR}
      # TLS terminated upstream by Traefik/Pangolin; trust the proxy's
      # X-Forwarded-* headers (otherwise rate-limiting + login flows misbehave).
      DISABLE_HTTPS: "True"
      LOADBALANCER_IPS: ${ZULIP_LOADBALANCER_IPS:-172.16.0.0/12}
      # SMTP via Resend. The other five Zulip secrets (postgres, memcached,
      # rabbitmq, redis, secret_key) are upstream's auto-generated noise and
      # stay file-mounted under zulip/secrets/. The SMTP password is the one
      # secret you actually edit — it lives in .env with the rest of Cumulus's
      # credentials, and the upstream entrypoint accepts SECRETS_* env vars
      # for any zulip-secrets.conf key.
      SETTING_EMAIL_HOST: ${ZULIP_SMTP_HOST:-smtp.resend.com}
      SETTING_EMAIL_HOST_USER: ${ZULIP_SMTP_USER:-resend}
      SETTING_EMAIL_PORT: ${ZULIP_SMTP_PORT:-587}
      SETTING_EMAIL_USE_TLS: "True"
      SECRETS_email_password: ${ZULIP_SMTP_PASSWORD}
      # Resend only authorizes sending from a verified domain — here the apex
      # parkerhdavis.com (same domain admin/Kitsu mail use). Left to its
      # defaults Zulip derives the noreply From from EXTERNAL_HOST, i.e.
      # noreply@zulip.parkerhdavis.com — an unverified subdomain Resend
      # rejects with "550 ... not authorized to send emails from ...". Point
      # noreply mail at the verified apex; disabling the per-email bounce
      # token is required too, since the tokenized address
      # (noreply-{token}@...) is derived from EXTERNAL_HOST independently and
      # would otherwise keep using the rejected subdomain.
      SETTING_NOREPLY_EMAIL_ADDRESS: noreply@${BASE_DOMAIN}
      SETTING_ADD_TOKENS_TO_NOREPLY_ADDRESS: "False"
      # Mobile push notifications via Zulip's Mobile Push Notification Service.
      # Enabling the setting only routes pushes through the bouncer; the server
      # still has to be registered via `make zulip-register-push` (one-time,
      # interactive — accepts TOS, sends admin email + server metadata).
      # Submit_usage_statistics opted out — basic metadata still flows per
      # Zulip's docs, but the richer dataset is suppressed.
      SETTING_ZULIP_SERVICE_PUSH_NOTIFICATIONS: "True"
      SETTING_ZULIP_SERVICE_SUBMIT_USAGE_STATISTICS: "False"
      # Multi-threaded queue workers use noticeably less RAM than the
      # multi-process default — fine for a small instance.
      CONFIG_application_server__queue_workers_multiprocess: "false"
    volumes:
      - zulip-data:/data
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - zulip-database
      - zulip-memcached
      - zulip-rabbitmq
      - zulip-redis

  zulip-database:
    image: zulip/zulip-postgresql:14
    container_name: zulip_database
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    volumes:
      - zulip-postgresql-14:/var/lib/postgresql/data

  zulip-memcached:
    image: memcached:alpine
    container_name: zulip_memcached
    restart: unless-stopped
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      # memcached:alpine runs as the unprivileged `memcache` user. For file-based
      # secrets, Compose preserves the host file's permissions in the container
      # mount, so `make setup phd-server` chmods the three sidecar secrets 0644
      # to make them readable to the sidecar users (the other two, postgres and
      # secret_key, are only read by root-running entrypoints and stay 0600).
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password

  zulip-rabbitmq:
    image: rabbitmq:4.2
    container_name: zulip_rabbitmq
    restart: unless-stopped
    command:
      - sh
      - -euc
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      # rabbitmq:4.2 runs as the `rabbitmq` user — see comment on
      # zulip-memcached's secret block for the chmod-on-host rationale.
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - zulip-rabbitmq:/var/lib/rabbitmq

  zulip-redis:
    image: redis:alpine
    container_name: zulip_redis
    restart: unless-stopped
    command:
      - sh
      - -euc
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      # redis:alpine runs as the `redis` user — see comment on
      # zulip-memcached's secret block for the chmod-on-host rationale.
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - zulip-redis-data:/data

  # Kitsu / Zou (CGWire) — production tracking for CG / animation pipelines.
  # Images are built locally from CGWire's own artifacts (Zou via PyPI, the
  # Kitsu frontend from the cgwire/kitsu "<version>-build" git tag) — see
  # ./kitsu/. build.sh's runtime work from the upstream fork is absorbed here:
  # the PG-18 data layout is pinned below and first-run init lives in
  # `make kitsu-init`. Runtime config comes from ./kitsu/kitsu.env, rendered by
  # `make setup phd-server`. All seven services run on the dedicated
  # kitsu-internal network (not the shared default), reachable only via the
  # published frontend port.
  kitsu:
    build:
      context: ./kitsu/web
      args:
        KITSU_VERSION: ${KITSU_VERSION:-1.0.46}
    image: cumulus-kitsu:${KITSU_VERSION:-1.0.46}
    container_name: kitsu
    restart: unless-stopped
    networks:
      - kitsu-internal
    env_file: ./kitsu/kitsu.env
    ports:
      # Published on the host loopback — works even though the container is only
      # on kitsu-internal (port publishing is independent of Docker networks).
      - "127.0.0.1:${KITSU_HOST_PORT:-8083}:80"
    depends_on:
      - kitsu-zou-app
      - kitsu-zou-event
      - kitsu-zou-jobs

  kitsu-zou-app:
    <<: *zou-build
    container_name: kitsu-zou-app
    restart: unless-stopped
    networks:
      - kitsu-internal
    env_file: ./kitsu/kitsu.env
    command: "gunicorn --error-logfile - --access-logfile - -w 3 -k gevent -b :5000 zou.app:app"
    volumes:
      - ${KITSU_PREVIEW_PATH}:/opt/zou/previews
      - kitsu-tmp:/tmp/zou
    depends_on:
      kitsu-db:
        condition: service_healthy
      kitsu-redis:
        condition: service_started
      kitsu-indexer:
        condition: service_healthy
    healthcheck:
      test: "curl -s -f http://localhost:5000 | grep -q '\"api\":\"Zou\"'"

  kitsu-zou-event:
    <<: *zou-build
    container_name: kitsu-zou-event
    restart: unless-stopped
    networks:
      - kitsu-internal
    env_file: ./kitsu/kitsu.env
    command: "gunicorn --error-logfile - --access-logfile - -w 1 -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker -b :5001 zou.event_stream:app"
    depends_on:
      - kitsu-redis
    healthcheck:
      test: "curl -s -f http://localhost:5001 | grep -q '\"api\":\"Zou\"'"

  kitsu-zou-jobs:
    <<: *zou-build
    container_name: kitsu-zou-jobs
    restart: unless-stopped
    networks:
      - kitsu-internal
    env_file: ./kitsu/kitsu.env
    command: "rq worker -c zou.job_settings"
    volumes:
      - ${KITSU_PREVIEW_PATH}:/opt/zou/previews
      - kitsu-tmp:/tmp/zou
    depends_on:
      kitsu-redis:
        condition: service_started
      kitsu-db:
        condition: service_healthy

  kitsu-db:
    image: postgres:${KITSU_DB_VERSION:-18}-alpine
    container_name: kitsu-db
    restart: unless-stopped
    networks:
      - kitsu-internal
    environment:
      # Auto-creates the DB so init only seeds schema/admin.
      POSTGRES_DB: zoudb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KITSU_DB_PASSWORD}
    volumes:
      # PG-18 uses a versioned data subdir, so mount the parent. For
      # KITSU_DB_VERSION < 18, change the target to /var/lib/postgresql/data.
      - ${KITSU_DB_PATH}:/var/lib/postgresql
    healthcheck:
      # Force a TCP check (-h 127.0.0.1): first-boot initdb runs a socket-only
      # temp server, so a plain socket check reports healthy before the real TCP
      # listener is up. start_period covers the initdb window on a cold start.
      test: "pg_isready -h 127.0.0.1 -d zoudb -U postgres"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  kitsu-redis:
    image: redis:alpine
    container_name: kitsu-redis
    restart: unless-stopped
    networks:
      - kitsu-internal
    volumes:
      - kitsu-redis:/data

  kitsu-indexer:
    image: getmeili/meilisearch:${KITSU_INDEXER_VERSION:-v1.31}
    container_name: kitsu-indexer
    restart: unless-stopped
    networks:
      - kitsu-internal
    environment:
      MEILI_MASTER_KEY: ${KITSU_INDEXER_KEY}
    volumes:
      - kitsu-indexer:/meili_data
    healthcheck:
      test: "curl -s -f http://localhost:7700/health | grep -q '{\"status\":\"available\"}'"

volumes:
  jellyfin-config:
    external: true
  jellyfin-cache:
    external: true
  open-webui-data:
  immich-model-cache:
  zulip-data:
  zulip-postgresql-14:
  zulip-rabbitmq:
  zulip-redis-data:
  kitsu-redis:
  kitsu-tmp:
  kitsu-indexer:

networks:
  # Dedicated network for the Kitsu stack — isolates its Postgres/Redis/indexer
  # from the rest of phd-server. Other services have no `networks:` key and so
  # stay on the implicit default network.
  kitsu-internal:

secrets:
  zulip__postgres_password:
    file: ./zulip/secrets/postgres_password
  zulip__memcached_password:
    file: ./zulip/secrets/memcached_password
  zulip__rabbitmq_password:
    file: ./zulip/secrets/rabbitmq_password
  zulip__redis_password:
    file: ./zulip/secrets/redis_password
  zulip__secret_key:
    file: ./zulip/secrets/secret_key
